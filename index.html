          var theme = 'default';
          if (raw !== null) {
            var normalized = String(raw).trim().toLowerCase();
            if (valid[normalized]) {
              theme = normalized;
            } else {
              window.localStorage.removeItem('site_theme');
              window.localStorage.removeItem('site_halloween_enabled');
            }
          } else if (
            window.localStorage.getItem('site_halloween_enabled') === 'true'
          ) {
            theme = 'halloween';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'default');
        }
      })();
